[tool.poetry]
name = "prescott-national-bank-backend"
version = "0.1.0"
description = "Prescott National Bank Online Banking Backend API"
authors = ["SIRI-bit-tech <siritech001@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.139.0,<0.140.0"
uvicorn = {extras = ["standard"], version = ">=0.51.0,<0.52.0"}
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.51,<3.0.0"}
alembic = ">=1.18.5,<2.0.0"
asyncpg = ">=0.31.0,<0.32.0"
pydantic = {extras = ["email"], version = ">=2.13.4,<3.0.0"}
pydantic-settings = ">=2.14.2,<3.0.0"
python-dotenv = ">=1.2.2,<2.0.0"
argon2-cffi = ">=25.1.0,<26.0.0"
ably = ">=3.1.2,<4.0.0"
python-multipart = ">=0.0.32,<0.0.33"
aiofiles = ">=25.1.0,<26.0.0"
httpx = ">=0.28.1,<0.29.0"
jinja2 = ">=3.1.6,<4.0.0"
cryptography = ">=49.0.0,<50.0.0"
email-validator = ">=2.3.0,<3.0.0"
stytch = ">=15.3.0,<16.0.0"
upyloadthing = ">=0.2.1,<0.3.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0.0"
pytest-asyncio = ">=1.4.0,<2.0.0"
ruff = ">=0.15.21,<0.16.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
